name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: mise run check
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - run: bash scripts/pack-smoke.sh "$RUNNER_TEMP"/pack/backe-*.tgz
