name: CI

on:
  # Feature-Branches prüft der pull_request-Lauf; ein ungefilterter push liefe dort doppelt.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Vitest braucht auf macOS etwa dreimal so lange wie auf Ubuntu, daher doppelt so viele Shards.
  # Die Coverage-Schwellen prüft nur Ubuntu; sie hängen nicht vom Betriebssystem ab.
  ubuntu:
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      shards: "[1, 2]"
      coverage: true
      checks: true

  macos:
    uses: ./.github/workflows/test.yml
    with:
      os: macos-latest
      shards: "[1, 2, 3, 4]"
      checks: true

  # Browser-E2E gegen das gebaute backe ui (playwright.config.ts) in chromium, firefox und webkit.
  # Mit `CI` wiederholt Playwright einen gescheiterten Test einmal und bricht bei `test.only` ab.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # Die Fixture startet dist/cli.js; die Browser samt Systembibliotheken holt Playwright.
      - run: mise run build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:e2e
      # Traces der gescheiterten Tests (`retain-on-failure`) zum Nachsehen mit `playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
