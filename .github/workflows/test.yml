name: Test

# Geshardete Vitest-Läufe für ci.yml und release.yml. Mit `coverage` schreibt jeder Shard einen
# Blob-Report; der Job `coverage` führt sie zusammen und prüft erst dort die Schwellen, denn ein
# einzelner Shard reißt sie zwangsläufig (siehe vitest.config.ts).
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      shards:
        description: 'Shard-Indizes als JSON-Array, z. B. "[1, 2]"; die Anzahl ist die Länge'
        type: string
        required: true
      coverage:
        type: boolean
        default: false
      checks:
        description: "Shard 1 prüft zusätzlich Biome, tsc und den gepackten Tarball"
        type: boolean
        default: false
      ref:
        description: "Ref für den Checkout; leer heißt: der auslösende Commit"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shard:
    name: shard ${{ matrix.shard }}/${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - if: inputs.checks && matrix.shard == 1
        run: pnpm exec biome ci .
      - if: inputs.checks && matrix.shard == 1
        run: mise run lint
      # Die E2E-Tests rufen dist/cli.js auf.
      - run: mise run build

      - name: Vitest
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          if [ "$COVERAGE" = true ]; then
            pnpm exec vitest run --shard="$SHARD" --coverage \
              --reporter=default --reporter=blob \
              --outputFile.blob=".vitest-reports/blob-${SHARD/\//-}.json"
          else
            pnpm exec vitest run --shard="$SHARD"
          fi

      - if: inputs.coverage
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ inputs.os }}-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - if: inputs.checks && matrix.shard == 1
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - if: inputs.checks && matrix.shard == 1
        run: bash scripts/pack-smoke.sh "$RUNNER_TEMP"/pack/*.tgz

  coverage:
    needs: shard
    if: inputs.coverage
    # Die Blobs tragen absolute Pfade des Runners; zusammengeführt wird auf demselben OS.
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-${{ inputs.os }}-*
          path: .vitest-reports
          merge-multiple: true
      - run: pnpm exec vitest run --merge-reports=.vitest-reports --coverage
