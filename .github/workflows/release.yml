name: Release

on:
  push:
    branches: [main]
  # Rückweg, wenn build oder publish nach dem Tag scheiterte: baut und publisht
  # genau diesen Tag noch einmal, ohne release-please.
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Release-Tag, z. B. v0.1.0"
        required: true
        type: string

permissions: {}

jobs:
  # Schreibt mit dem Token der GitHub App statt mit GITHUB_TOKEN: Einen PR, den GITHUB_TOKEN
  # anlegt oder aktualisiert, prüft die CI erst nach manueller Freigabe.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tag und Version aus release-please (push) oder aus der Eingabe (dispatch).
  target:
    needs: release-please
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RP_TAG"
          fi
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Kein gültiger Release-Tag: »$TAG« (erwartet vX.Y.Z)"
            exit 1
          fi
          VERSION="${TAG#v}"
          if [ "$EVENT" = push ] && [ "$VERSION" != "$RP_VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $RP_VERSION von release-please"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "::error::Zum Tag $TAG gibt es kein GitHub-Release"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Fremder Code (Dev-Abhängigkeiten, Tests) läuft nur in test und build, ohne
  # Schreibrechte und ohne OIDC; publish bekommt nur den fertigen Tarball.
  test:
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      os: ubuntu-latest
      shards: "[1, 2]"
      coverage: true
      ref: ${{ needs.target.outputs.tag }}

  # Läuft parallel zu test; publish wartet auf beide.
  build:
    needs: target
    # !cancelled() hebt das Überspringen auf, das ein übersprungener release-please
    # (workflow_dispatch) sonst über target hinweg vererbt.
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      # Baut prepack beim Packen; die Tests laufen geshardet im Job test.
      - run: mise run lint

      - name: Tarball packen
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Erwartet genau einen Tarball, gefunden ${#tarballs[@]}"
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Pack-Smoke-Test
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bash scripts/pack-smoke.sh "$TARBALL"

      - name: Version gegen den Tag prüfen
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_VERSION: ${{ needs.target.outputs.version }}
        run: |
          VERSION="$(tar -xOf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Tarball hat $VERSION, der Tag verlangt $RELEASE_VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # Kein Checkout, kein Projektcode: nur Node, der Tarball und npm.
  publish:
    needs: [target, test, build]
    if: >-
      ${{ !cancelled() && needs.target.result == 'success' &&
        needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      # Erstanbieter-Action: in diesem Job liegt das OIDC-Recht.
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: npm-Version prüfen
        run: |
          v="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map((n) => Number.parseInt(n, 10));
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$v"; then
            echo "::error::npm $v ist zu alt für Trusted Publishing, gebraucht wird npm ≥ 11.5.1"
            exit 1
          fi
          echo "npm $v"

      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: ${{ runner.temp }}/pack

      - name: Tarball finden
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Erwartet genau einen Tarball, gefunden ${#tarballs[@]}"
            exit 1
          fi
          echo "TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"

      - name: Publish idempotent
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.target.outputs.version }}
        run: |
          PKG_JSON="$(tar -xOf "$TARBALL" package/package.json)"
          NAME="$(printf '%s' "$PKG_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          VERSION="$(printf '%s' "$PKG_JSON" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Tarball hat $VERSION, der Tag verlangt $RELEASE_VERSION"
            exit 1
          fi
          # Nur für die erste Veröffentlichung: danach läuft der Publish über OIDC,
          # das Secret ist gelöscht und dieser Zweig bleibt stumm.
          if [ -n "$NPM_TOKEN" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > ~/.npmrc
            echo "NPM_TOKEN gesetzt, Publish mit Token"
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION liegt schon auf npm, Publish übersprungen"
          else
            echo "$NAME@$VERSION fehlt auf npm, wird publisht"
            npm publish "$TARBALL" --provenance --access public
          fi

      - name: Tarball ans GitHub-Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release upload "$TAG" "$TARBALL" --clobber --repo "$GITHUB_REPOSITORY"
